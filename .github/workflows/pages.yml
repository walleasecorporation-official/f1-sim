# 정적 사이트(저장소 루트 전체)를 GitHub Pages 로 배포한다.
# 빌드 과정은 없다: index.html + css/ + js/ (three.js 포함) 를 그대로 올린다.
# 처음 한 번은 저장소 Settings → Pages → Build and deployment → Source 를
# "GitHub Actions" 로 바꿔야 한다. (자세한 내용은 README.md 참고)
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/f1-simulator-improvements-nml6oi
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않고 끝까지 마친다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
